name: guardou

services:
  guardou:
    image: ghcr.io/guardouapp/guardou:latest
    container_name: guardou
    ports:
      - "8080:8080"
    volumes:
      - data:/data
    # environment:
    #   PUID: 1000
    #   PGID: 1000
    #   TZ: America/Sao_Paulo
    restart: unless-stopped

volumes:
  data:
