name: Frontend tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Analyze and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: frontend/pubspec.yaml
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run swagger_parser && dart run build_runner build

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test
