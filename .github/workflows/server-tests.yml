name: Server tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Install preview tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg poppler-utils

      - name: Build
        run: dotnet build Guardou.sln -c Release

      - name: Require an up-to-date OpenAPI document
        run: git diff --exit-code -- ../api/openapi.json

      - name: Test
        run: dotnet test Guardou.sln -c Release --no-build
