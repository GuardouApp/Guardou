name: Release

# release-please keeps a release PR open that bumps the version and updates
# CHANGELOG.md from the Conventional Commits on main. Merging that PR tags the
# release, creates the GitHub release and publishes the Docker image.
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-please:
    name: Release PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}

    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json

  release-assets:
    name: Release assets
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Attach the Docker Compose files to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh release upload "$TAG" docker/docker-compose.yaml docker/example.env --clobber

  # Tags created with GITHUB_TOKEN don't trigger other workflows, so the
  # Docker publish workflow is called directly instead of on the tag push.
  docker-publish:
    name: Docker publish
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/docker-publish.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
